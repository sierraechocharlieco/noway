<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>No Way! · Rules</title>
  <link rel="stylesheet" href="rules.css">
</head>
<body>
  <main class="shell">
    <header class="header">
      <div>
        <div class="brand-header"><img src="../assets/betta-mark.png" width="44" height="44" alt=""><div><span class="wordmark">No Way!</span><span class="byline">Sierra Echo Charlie</span></div></div>
        <h1>Rules</h1>
        <p>Manage blocked and allowed actions by site.</p>
      </div>
      <div class="actions">
        <button id="delete-selected" class="danger" type="button" disabled>Delete Selected</button>
        <button id="export-rules" type="button">Export</button>
        <button id="import-rules" type="button">Import</button>
        <span id="selected-count" class="selection-count">No rules selected</span>
        <input id="import-file" type="file" accept="application/json,.json" hidden>
      </div>
    </header>

    <section id="origins" class="origins"></section>
    <p id="message" class="message" role="status"></p>
  </main>

  <dialog id="raw-editor-modal" class="modal" aria-labelledby="raw-heading">
    <div class="modal-content">
      <header class="modal-header">
        <h2 id="raw-heading">Edit Rule JSON</h2>
        <button id="close-modal" type="button" class="close-button">Close</button>
      </header>
      <div class="modal-body raw-body">
        <label for="raw-json" class="editor-label">Rule JSON</label>
        <textarea id="raw-json" spellcheck="false" aria-describedby="raw-error"></textarea>
        <p id="raw-error" class="error" role="alert"></p>
      </div>
      <footer class="modal-footer">
        <button id="save-raw" class="primary" type="button">Save Changes</button>
        <button id="cancel-raw" type="button">Cancel</button>
      </footer>
    </div>
  </dialog>

  <dialog id="export-modal" class="modal" aria-labelledby="export-heading">
    <div class="modal-content">
      <header class="modal-header">
        <h2 id="export-heading">Export Rules</h2>
        <button id="close-export" type="button" class="close-button">Close</button>
      </header>
      <div class="modal-body export-body">
        <p class="export-help">Choose which sites to include in the export file.</p>
        <div class="export-toolbar">
          <button id="export-select-all" type="button">Select all</button>
          <button id="export-clear-all" type="button">Clear</button>
          <span id="export-count" class="export-count">0 selected</span>
        </div>
        <div id="export-origins" class="export-origins"></div>
      </div>
      <footer class="modal-footer">
        <button id="export-confirm" class="primary" type="button" disabled>Download</button>
        <button id="export-cancel" type="button">Cancel</button>
      </footer>
    </div>
  </dialog>

  <dialog id="delete-modal" class="modal compact-modal" aria-labelledby="delete-heading">
    <div class="modal-content">
      <header class="modal-header"><h2 id="delete-heading">Delete selected rules?</h2></header>
      <div class="modal-body export-body"><p id="delete-help"></p><p>Auto won’t recreate these rules without your review.</p><p id="delete-error" class="error" role="alert"></p></div>
      <footer class="modal-footer"><button id="delete-cancel" type="button" autofocus>Cancel</button><button id="delete-confirm" class="danger-filled" type="button">Delete Rules</button></footer>
    </div>
  </dialog>

  <script src="rules.js"></script>
</body>
</html>
